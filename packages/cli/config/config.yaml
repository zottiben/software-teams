# Software Teams Global Configuration
# Edit these settings to customise Software Teams behaviour

version: "1.0.0"

# ─────────────────────────────────────────────────────────────────────────────
# Workflow Settings
# ─────────────────────────────────────────────────────────────────────────────
workflow:
  # Mode: yolo (autonomous) | interactive (confirm gates) | strict (all confirmations)
  mode: yolo

  # Depth: shallow | standard | deep (affects task granularity)
  depth: standard

  # Enable parallel plan execution within waves
  parallelisation: true

  # Commit planning docs to git
  commit_docs: true

# ─────────────────────────────────────────────────────────────────────────────
# Agent Toggles
# ─────────────────────────────────────────────────────────────────────────────
agents:
  # Run research phase before planning
  research: true

  # Validate plans before execution
  plan_check: true

  # Verify outcomes after execution
  verifier: true

# ─────────────────────────────────────────────────────────────────────────────
# Model Routing
# ─────────────────────────────────────────────────────────────────────────────
models:
  # Active profile: quality | balanced | budget
  profile: balanced

  # Profile definitions (agent key = hyphenated name minus "software-teams-")
  #
  # Two independent dials:
  #   model  = how CAPABLE the agent is   (opus | sonnet | haiku | fable)
  #   effort = how THOROUGH it is         (low | medium | high | xhigh | max)
  #
  # Values are model ALIASES, not pinned IDs. Aliases track Anthropic's
  # recommended version for each family, so these profiles do not go stale every
  # time a model ships. Pin a full ID such as `claude-opus-5` here or in
  # `overrides:` if you need a fixed version.
  #
  # `fable` is for work larger than a single sitting. It costs the most per
  # token and, on subscription auth, draws hardest on the seat allowance, so it
  # appears only in the `quality` profile. Fable verifies its own work with less
  # prompting: do not add verification reminders to specs that run on it.
  profiles:
    # Maximum capability, for critical work
    quality:
      planner: fable
      dev-planner: opus
      architect: fable
      producer: fable
      plan-checker: opus
      product-lead: opus
      head-engineering: opus
      researcher: fable
      phase-researcher: opus
      backend: opus
      frontend: opus
      programmer: opus
      devops: opus
      codebase-mapper: opus
      ux-designer: opus
      pr-generator: opus
      pr-feedback: opus
      feedback-learner: opus
      quality: opus
      security: opus
      support-triage: sonnet
      perf-analyst: opus
      verifier: opus
      committer: sonnet
      debugger: sonnet
      qa-tester: sonnet
      game-designer: opus
      game-producer: opus
      game-engineer: opus
      game-ai-engineer: opus
      game-art-pipeline: opus
      game-devops: opus
      game-qa: opus
      game-tech-artist: opus

      # Effort = how thorough, independent of model = how capable.
      # Sparse on purpose: anything not listed inherits the model's default
      # effort, which is what Anthropic recommends for most work. Entries
      # here are deliberate overrides only.
      effort:
        debugger: xhigh
        security: xhigh
        qa-tester: high
        plan-checker: high
        verifier: high
        committer: low
        pr-generator: low

    # Smart allocation for typical development
    balanced:
      planner: opus
      dev-planner: opus
      architect: opus
      producer: opus
      plan-checker: opus
      product-lead: opus
      head-engineering: opus
      researcher: opus
      phase-researcher: sonnet
      backend: opus
      frontend: opus
      programmer: opus
      devops: sonnet
      codebase-mapper: sonnet
      ux-designer: sonnet
      pr-generator: sonnet
      pr-feedback: sonnet
      feedback-learner: sonnet
      quality: sonnet
      security: sonnet
      support-triage: sonnet
      perf-analyst: sonnet
      verifier: sonnet
      committer: haiku
      debugger: sonnet

      # Effort = how thorough, independent of model = how capable.
      # Sparse on purpose: anything not listed inherits the model's default
      # effort, which is what Anthropic recommends for most work. Entries
      # here are deliberate overrides only.
      effort:
        debugger: high
        security: high
        qa-tester: medium
        committer: low
        pr-generator: low
        feedback-learner: low
      # qa-tester owns evidence-based verification (baseline proofs, contract +
      # a11y judgement) — it needs reasoning, not the cheapest model. sonnet.
      qa-tester: sonnet
      game-designer: opus
      game-producer: opus
      game-engineer: sonnet
      game-ai-engineer: sonnet
      game-art-pipeline: sonnet
      game-devops: sonnet
      game-qa: sonnet
      game-tech-artist: sonnet

    # Minimal opus usage, conserve quota
    budget:
      planner: sonnet
      dev-planner: sonnet
      architect: sonnet
      producer: sonnet
      plan-checker: sonnet
      product-lead: sonnet
      head-engineering: sonnet
      researcher: sonnet
      phase-researcher: haiku
      backend: sonnet
      frontend: sonnet
      programmer: sonnet
      devops: sonnet
      codebase-mapper: sonnet
      ux-designer: sonnet
      pr-generator: sonnet
      pr-feedback: sonnet
      feedback-learner: sonnet
      quality: sonnet
      security: sonnet
      support-triage: haiku
      perf-analyst: sonnet
      verifier: haiku
      committer: haiku
      debugger: sonnet
      qa-tester: haiku
      game-designer: sonnet
      game-producer: sonnet
      game-engineer: sonnet
      game-ai-engineer: sonnet
      game-art-pipeline: sonnet
      game-devops: sonnet
      game-qa: sonnet
      game-tech-artist: sonnet

      # Effort = how thorough, independent of model = how capable.
      # Sparse on purpose: anything not listed inherits the model's default
      # effort, which is what Anthropic recommends for most work. Entries
      # here are deliberate overrides only.
      effort:
        debugger: medium
        committer: low
        pr-generator: low
        feedback-learner: low

  # Override a specific agent's MODEL (null = use profile default; hyphenated keys)
  overrides:
    planner: null
    dev-planner: null
    architect: null
    producer: null
    plan-checker: null
    product-lead: null
    head-engineering: null
    researcher: null
    phase-researcher: null
    backend: null
    frontend: null
    programmer: null
    devops: null
    codebase-mapper: null
    ux-designer: null
    pr-generator: null
    pr-feedback: null
    feedback-learner: null
    quality: null
    security: null
    perf-analyst: null
    verifier: null
    committer: null
    debugger: null
    qa-tester: null
    game-designer: null
    game-producer: null
    game-engineer: null
    game-ai-engineer: null
    game-art-pipeline: null
    game-devops: null
    game-qa: null
    game-tech-artist: null

  # Override a specific agent's EFFORT (null = inherit the model's default).
  # Deliberately not pre-populated with every agent: an entry here is a
  # statement that this role needs more or less thoroughness than the default,
  # and a file full of nulls invites cargo-culting one in.
  effort_overrides: {}

# ─────────────────────────────────────────────────────────────────────────────
# Default Paths and Values
# ─────────────────────────────────────────────────────────────────────────────
defaults:
  branch_prefix: "feature/"
  commit_types:
    - feat
    - fix
    - refactor
    - docs
    - test
    - chore
    - perf
    - style
  plan_location: .software-teams/plans
  state_location: .software-teams
  thoughts_location: .software-teams/thoughts

# ─────────────────────────────────────────────────────────────────────────────
# Git Settings
# ─────────────────────────────────────────────────────────────────────────────
git:
  # Automatically stage changes before commit
  auto_stage: false

  # Require clean worktree before operations
  require_clean_worktree: false

  # Branches that cannot be directly modified
  protected_branches:
    - main
    - master
    - develop

# ─────────────────────────────────────────────────────────────────────────────
# Quality Gates
# ─────────────────────────────────────────────────────────────────────────────
quality:
  # Run linter before each commit
  run_lint_before_commit: true

  # Run tests before creating PR
  run_tests_before_pr: true

  # Require verification pass before marking complete
  require_verification: true

# ─────────────────────────────────────────────────────────────────────────────
# Context Management
# ─────────────────────────────────────────────────────────────────────────────
context:
  # Maximum files to include per task context
  max_files_per_task: 5

  # Number of tasks before recommending split
  split_threshold_tasks: 3

  # Context budget thresholds (0.0 - 1.0)
  context_budget_warning: 0.5   # Yellow zone
  context_budget_critical: 0.7  # Red zone

# ─────────────────────────────────────────────────────────────────────────────
# UI Settings
# ─────────────────────────────────────────────────────────────────────────────
ui:
  # Show progress banners during execution
  show_progress_banners: true

  # Enable verbose output
  verbose_mode: false

  # Use emoji in output (disabled for cleaner logs)
  emoji_enabled: false
